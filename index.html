<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEPS Survey - Welcome</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>
<body>

    <header class="top-bar">
        <h1>SHEPS Loading Survey</h1>
        <div class="header-icons">
            <span class="icon-placeholder"></span>
            <div class="search-placeholder"></div>
        </div>
    </header>

    <main id="content-container">
        
        <div class="welcome-card">
            <h2>WELCOME</h2>
            
            <label for="order-select" class="welcome-text">Please select the number stated by your facilitator.</label>
            
            <select id="order-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            
            <p class="welcome-text">Press Start when instructed by your facilitator.</p>
            <button class="start-btn" id="start-survey-btn">Start the Survey</button>
        </div>

    </main>
    
    <script src="js/welcome.js"></script>
</body>
</html>
