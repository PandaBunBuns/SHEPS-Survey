<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEPS Patience Task</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/patience.css">
</head>
<body>

    <header class="top-bar">
        <h1>SHEPS Loading Survey</h1>
        <div class="header-icons">
            <span class="icon-placeholder"></span>
            <div class="search-placeholder"></div>
        </div>
    </header>

    <main id="content-container">
        
        <div class="question-card">
            <h2 id="question-title">QUESTIONS</h2>

            <ol class="question-list">
                <li>Why did you want to stop waiting for it to load?</li>
                <li>How long do you think they waited for?</li>
                <li>What made you wait for that amount of time and not shorter?</li>
            </ol>
            
            <button class="done-btn" id="patience-done-btn">DONE</button>
        </div>

    </main>
    
    <script src="js/patience.js"></script>
</body>
</html>
