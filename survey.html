<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEPS Survey</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/survey.css">
</head>
<body>

    <header class="top-bar">
        <h1>SHEPS Loading Survey</h1>
        <div class="header-icons">
            <span class="icon-placeholder"></span>
            <div class="search-placeholder"></div>
        </div>
    </header>

    <main id="content-container">
        
        <form class="survey-card">
            <h2 id="survey-title">SURVEY</h2>

            <div class="question-block">
                <p class="question-text">Overall Satisfaction on the Loading Indicator</p>
                <div class="options-container">
                    <label><input type="radio" name="satisfaction" value="1"><span>1</span></label>
                    <label><input type="radio" name="satisfaction" value="2"><span>2</span></label>
                    <label><input type="radio" name="satisfaction" value="3"><span>3</span></label>
                    <label><input type="radio" name="satisfaction" value="4"><span>4</span></label>
                    <label><input type="radio" name="satisfaction" value="5"><span>5</span></label>
                    <label><input type="radio" name="satisfaction" value="6"><span>6</span></label>
                    <label><input type="radio" name="satisfaction" value="7"><span>7</span></label>
                </div>
            </div>

            <div class="question-block">
                <p class="question-text">How Pleasant was the Loading Indicator for you?</p>
                <div class="options-container">
                    <label><input type="radio" name="pleasant" value="1"><span>1</span></label>
                    <label><input type="radio" name="pleasant" value="2"><span>2</span></label>
                    <label><input type="radio" name="pleasant" value="3"><span>3</span></label>
                    <label><input type="radio" name="pleasant" value="4"><span>4</span></label>
                    <label><input type="radio" name="pleasant" value="5"><span>5</span></label>
                    <label><input type="radio" name="pleasant" value="6"><span>6</span></label>
                    <label><input type="radio" name="pleasant" value="7"><span>7</span></label>
                </div>
            </div>

            <div class="question-block">
                <p class="question-text">How Interesting was the Loading Indicator for you?</p>
                <div class="options-container">
                    <label><input type="radio" name="interesting" value="1"><span>1</span></label>
                    <label><input type="radio" name="interesting" value="2"><span>2</span></label>
                    <label><input type="radio" name="interesting" value="3"><span>3</span></label>
                    <label><input type="radio" name="interesting" value="4"><span>4</span></label>
                    <label><input type="radio" name="interesting" value="5"><span>5</span></label>
                    <label><input type="radio" name="interesting" value="6"><span>6</span></label>
                    <label><input type="radio" name="interesting" value="7"><span>7</span></label>
                </div>
            </div>

            <div class="question-block">
                <p class="question-text">How Visually Appealing was the Loading Indicator for you?</p>
                <div class="options-container">
                    <label><input type="radio" name="appealing" value="1"><span>1</span></label>
                    <label><input type="radio" name="appealing" value="2"><span>2</span></label>
                    <label><input type="radio" name="appealing" value="3"><span>3</span></label>
                    <label><input type="radio" name="appealing" value="4"><span>4</span></label>
                    <label><input type="radio" name="appealing" value="5"><span>5</span></label>
                    <label><input type="radio" name="appealing" value="6"><span>6</span></label>
                    <label><input type="radio" name="appealing" value="7"><span>7</span></label>
                </div>
            </div>

            <div class="question-block">
                <p class="question-text">How do you think you waited for?</p>
                <div class="options-container">
                    <label><input type="radio" name="wait" value="1"><span>1</span></label>
                    <label><input type="radio" name="wait" value="2"><span>2</span></label>
                    <label><input type="radio" name="wait" value="3"><span>3</span></label>
                    <label><input type="radio" name="wait" value="4"><span>4</span></label>
                    <label><input type="radio" name="wait" value="5"><span>5</span></label>
                    <label><input type="radio" name="wait" value="6"><span>6</span></label>
                    <label><input type="radio" name="wait" value="7"><span>7</span></label>
                    <label><input type="radio" name="wait" value="8"><span>8</span></label>
                    <label><input type="radio" name="wait" value="9"><span>9</span></label>
                    <label><input type="radio" name="wait" value="10"><span>10</span></label>
                </div>
                <div class="options-container">
                    <label><input type="radio" name="wait" value="11"><span>11</span></label>
                    <label><input type="radio" name="wait" value="12"><span>12</span></label>
                    <label><input type="radio" name="wait" value="13"><span>13</span></label>
                    <label><input type="radio" name="wait" value="14"><span>14</span></label>
                    <label><input type="radio" name="wait" value="15"><span>15</span></label>
                    <label><input type="radio" name="wait" value="16"><span>16</span></label>
                    <label><input type="radio" name="wait" value="17"><span>17</span></label>
                    <label><input type="radio" name="wait" value="18"><span>18</span></label>
                    <label><input type="radio" name="wait" value="19"><span>19</span></label>
                    <label><input type="radio" name="wait" value="20"><span>20</span></label>
                </div>
            </div>

            <button type="submit" class="done-btn" id="survey-done-btn">DONE</button>
        </form>

    </main>
    
    <script src="js/survey.js"></script>
</body>
</html>
